name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias del backend
        run: |
          python -m pip install --upgrade pip
          pip install -r app/backend/requirements.txt
          pip install bandit

      - name: Ejecutar test simple
        run: |
          python -m pytest -q app/backend || true

      - name: Análisis estático con Bandit
        run: |
          bandit -r app/backend -q || true

      - name: Verificar sintaxis de manifests
        run: |
          python - <<'PY'
          import os
          import sys
          from pathlib import Path
          import yaml

          manifests_dir = Path('manifests')
          if not manifests_dir.exists():
              raise SystemExit('No existe la carpeta manifests')

          for path in sorted(manifests_dir.glob('*.yaml')):
              with path.open('r', encoding='utf-8') as f:
                  yaml.safe_load_all(f)
              print(f'OK: {path}')
          PY
